name: Update community results gallery
on:
  push:
    branches: [main]
    paths:
      - 'assets/results/**'
      - 'scripts/build-results-gallery.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: community-results-gallery
  cancel-in-progress: false
jobs:
  update-gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: node scripts/build-results-gallery.mjs
      - name: Save the updated gallery
        run: |
          if git diff --quiet -- index.html assets/results/manifest.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html assets/results/manifest.json
          git commit -m "Update community results gallery"
          git push origin HEAD:main
